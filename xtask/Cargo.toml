[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
# TODO(msrv): the declared rust-version is wrong — the workspace's true MSRV is 1.89.0. (#5)
rust-version = "1.85"
# TODO(license): xtask declares no licence, so `cargo deny` fails the licence check. (#6)
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
