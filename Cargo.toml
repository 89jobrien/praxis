[workspace]
members = ["crates/*", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
# TODO(msrv): the declared rust-version is wrong — crux-improve 0.5.0 requires rustc 1.89.0. (#5)
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/89jobrien/praxis"
homepage = "https://github.com/89jobrien/praxis"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
# TODO(deps): `reqwest` is unused because the LLM evaluator is not wired into the module tree.
# Gate it behind the `llm` feature or drop it until then. (#9)
reqwest = { version = "0.12", features = ["json"] }
tempfile = "3"
# TODO(ci): this path dependency makes praxis unbuildable in CI and unpublishable. Publish the
# crux crates to crates.io, or provision the workspace alongside praxis in CI. (#2)
crux-improve = { path = "../crux/crates/crux-improve" }
